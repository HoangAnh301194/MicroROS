[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Previous ESP-IDF log reported 2 MB physical flash.
; Factory partition only, no OTA.
board_build.flash_size = 2MB
board_upload.flash_size = 2MB
board_upload.maximum_size = 2031616
board_build.partitions = partitions_2mb.csv

board_microros_distro = humble
board_microros_transport = wifi
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
